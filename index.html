    <link rel="manifest" href="/manifest.json" />

    <!-- Responsive viewport with safe-area support for notch/home-indicator -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS / iPadOS Standalone Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Μικροί Μαθητές" />
    
    <!-- Android / Chrome Theme -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f59e0b" />
    
    <title>Μικροί Μαθητές - Διασκεδαστική Μάθηση για Παιδιά</title>
    
    <!-- Google Fonts: Fredoka & Comfortaa -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }

      * {

        font-family: 'Fredoka', 'Comfortaa', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-amber-100 via-pink-100 to-sky-100 min-h-screen min-h-[100dvh]">
